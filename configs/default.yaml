# Default configuration for music generation system

model:
  model_type: "lstm"  # lstm, gru, transformer
  input_size: 1
  hidden_size: 512
  num_layers: 3
  output_size: 128  # Will be updated based on vocabulary
  dropout: 0.2
  bidirectional: false
  attention: true
  attention_heads: 8

data:
  sequence_length: 100
  batch_size: 32
  num_workers: 4
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  min_note_duration: 0.1
  max_note_duration: 4.0
  sample_rate: 22050

training:
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 1e-5
  gradient_clip_val: 1.0
  warmup_epochs: 5
  scheduler: "cosine"  # cosine, linear, step
  patience: 10
  min_delta: 0.001
  mixed_precision: true
  accumulate_grad_batches: 1
  optimizer: "adam"  # adam, adamw

generation:
  temperature: 1.0
  top_k: 50
  top_p: 0.9
  max_length: 500
  seed_length: 100
  sampling_strategy: "nucleus"  # greedy, nucleus, top_k, temperature
  repetition_penalty: 1.1

evaluation:
  metrics:
    - "perplexity"
    - "nll"
    - "diversity"
    - "coherence"
    - "rhythm_consistency"
  eval_batch_size: 16
  num_samples: 100

system:
  device: "auto"  # auto, cpu, cuda, mps
  seed: 42
  deterministic: true
  log_level: "INFO"
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  assets_dir: "assets"

# Optional: Weights & Biases logging
wandb:
  enabled: false
  project: "music-generation"
