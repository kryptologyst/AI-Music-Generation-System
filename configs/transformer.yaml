# Transformer configuration for music generation

model:
  model_type: "transformer"
  input_size: 1
  hidden_size: 512
  num_layers: 6
  output_size: 128  # Will be updated based on vocabulary
  dropout: 0.1
  bidirectional: false
  attention: true
  attention_heads: 8

data:
  sequence_length: 200  # Longer sequences for transformer
  batch_size: 16  # Smaller batch size for transformer
  num_workers: 4
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  min_note_duration: 0.1
  max_note_duration: 4.0
  sample_rate: 22050

training:
  num_epochs: 150
  learning_rate: 0.0005  # Lower learning rate for transformer
  weight_decay: 1e-4
  gradient_clip_val: 1.0
  warmup_epochs: 10
  scheduler: "cosine"
  patience: 15
  min_delta: 0.001
  mixed_precision: true
  accumulate_grad_batches: 2
  optimizer: "adamw"

generation:
  temperature: 1.0
  top_k: 50
  top_p: 0.9
  max_length: 800  # Longer generation for transformer
  seed_length: 200
  sampling_strategy: "nucleus"
  repetition_penalty: 1.1

evaluation:
  metrics:
    - "perplexity"
    - "nll"
    - "diversity"
    - "coherence"
    - "rhythm_consistency"
  eval_batch_size: 8
  num_samples: 100

system:
  device: "auto"
  seed: 42
  deterministic: true
  log_level: "INFO"
  log_dir: "logs"
  checkpoint_dir: "checkpoints"
  assets_dir: "assets"

wandb:
  enabled: false
  project: "music-generation-transformer"
