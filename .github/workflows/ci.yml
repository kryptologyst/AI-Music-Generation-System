name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/ scripts/ tests/ --output-format=github
    
    - name: Format check with black
      run: |
        pip install black
        black --check src/ scripts/ tests/
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test model creation
      run: |
        python -c "
        import sys
        sys.path.append('src')
        from models.architecture import create_model
        config = {'model_type': 'lstm', 'input_size': 1, 'hidden_size': 64, 'num_layers': 2, 'output_size': 128}
        model = create_model(config)
        print('Model created successfully')
        "
    
    - name: Test data processing
      run: |
        python -c "
        import sys
        sys.path.append('src')
        from data.processor import generate_toy_dataset
        generate_toy_dataset('test_data', num_files=2)
        print('Data processing test completed')
        "
